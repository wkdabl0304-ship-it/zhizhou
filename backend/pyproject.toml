[project]
name = "backend"
version = "0.1.0"
description = "知舟企业 AI 工作空间后端"
readme = "README.md"
authors = [
    { name = "wkdabl0304-ship-it", email = "wkdabl0304@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pathlib>=1.0.1",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
