<!doctype html>
<!-- 浏览器静态入口：提供基础元信息、Vue 挂载容器和 ES 模块启动脚本。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="知舟，让工作始于一句话。通过对话梳理思路，探索新的工作方式。"
    />
    <title>知舟 · 让想法，有处启航</title>
    <script>
      // 首屏绘制前恢复外观，避免深色用户刷新时闪现浅色；存储不可用时默认浅色。
      try {
        const theme = localStorage.getItem('zhizhou-theme') === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch {
        /* 隐私模式下保持默认浅色。 */
      }
    </script>
  </head>
  <body>
    <!-- main.ts 将创建的 Vue 应用挂载到此节点。 -->
    <div id="app"></div>
    <!-- 模块源码在开发时由 Vite 提供，生产构建时替换为打包后的资源地址。 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
